name: Deploy NestJS Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.62.162.217
          username: varona-backend
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "Loading NVM environment..."

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            nvm use default || nvm use node

            echo "Going to project folder..."
            cd ~/htdocs/nest.local/app/LMS-backend

            echo "Resetting any local server changes..."
            git reset --hard
            git clean -fd

            echo "Pulling latest code..."
            git pull origin prod

            echo "Installing dependencies..."
            npm install --legacy-peer-deps

            echo "Building project..."
            npm run build && echo "✅ Build succeeded"

            echo "Restarting PM2..."
            pm2 restart lms-backend || pm2 start dist/src/main.js --name lms-backend

            echo "Waiting for app to start..."
            sleep 5

            echo "✅ Deploy complete. PM2 status:"
            pm2 list

            echo "📋 PM2 logs (last 50 lines):"
            pm2 logs lms-backend --lines 50 --nostream